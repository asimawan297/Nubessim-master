<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Verify Your Nubes Account</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #ffffff;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" border="0">
          <!-- Header with logo -->
          <tr>
            <td align="center" style="padding: 30px 0;">
              <img src="https://raw.githubusercontent.com/arhamsarwar786/nubes-images/refs/heads/main/logo.png" alt="logo" width="180" style="display:block; margin:0 auto; border:0; outline:none; text-decoration:none;">
            </td>
          </tr>

          <!-- Hero Image -->
          <tr>
            <td>
              <img src="https://raw.githubusercontent.com/arhamsarwar786/nubes-images/refs/heads/main/header7.png" alt="hero" width="680" style="display:block; width:100%; height:auto; border:0; outline:none; text-decoration:none;">
            </td>
          </tr>

          <!-- Body Content -->
          <tr>
            <td style="padding: 30px; text-align: center;">
              <h2 style="margin: 0 0 20px 0; font-size: 20px; color: #333;">Please verify your Nubes account</h2>
              <p style="font-size: 16px; color: #666; margin: 0 0 20px 0;">Hi <strong>{Name}</strong></p>
              <p style="font-size: 16px; color: #666; margin: 0 0 20px 0;">
                You’re one step to your first eSIM!<br>
                Please login to your Nubes account and enter this code to complete your account verification:
              </p>
              <p style="font-size: 32px; font-weight: bold; letter-spacing: 15px; color: #000; margin: 30px 0;">
                {VerificationCode}
              </p>
              <p style="font-size: 16px; color: #666; margin-top: 40px;">Thanks for signing up!<br>The Nubes Team</p>
            </td>
          </tr>

          <!-- Footer -->
        <tr>
            <td
              style="padding: 0px; margin: 0px; text-align: center; background-color: rgb(178, 76, 153); min-width: 5px; user-select: text; border: 0px solid transparent; background-image: unset; background-position: unset; background-size: unset; background-repeat: unset; background-attachment: unset; background-origin: unset; background-clip: unset;"
              fr-original-style="padding:0; margin:0; text-align:center; background-color:#b24c99;"><a
                href="https://www.nubessim.com" target="_blank" style="display: block; user-select: auto;"
                fr-original-style="display:block;">
                <img src="https://img.mailinblue.com/9762454/images/content_library/original/695ff77d48380fd515b4b39f.png"
                  alt="Nubes Footer" width="100%"
                  style="display: block; width: 100%; height: auto; border: 0px; outline: none; cursor: pointer; padding: 0px 1px; position: relative; max-width: 100%;"
                  fr-original-style="display:block; width:100%; height:auto; border:0; outline:none;"
                  fr-original-class="fr-draggable">
              </a></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
