name: nubesim
description: "E Sim Provider"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.9.3+102

environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  sizer: ^3.0.5
  bot_toast: ^4.1.3
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  logger: ^2.6.0
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  google_sign_in: ^6.1.5
  cloud_firestore: ^5.6.11
  fluttertoast: ^9.1.0
  uuid: 
  sign_in_with_apple: ^8.1.0
  esim_compatibility: ^1.0.2
  percent_indicator: ^4.2.5
  device_info_plus: ^11.3.0
  geolocator: 
  geocoding: ^4.0.0
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.14.4
  share_plus: ^11.1.0
  http: ^1.5.0
  path_provider: ^2.1.5
  esim_installer_flutter: ^1.2.1
  webview_flutter: ^4.13.0
  flutter_icon_snackbar: ^1.2.1
  crypto: ^3.0.3
  geolocator_android: ^5.0.2
  another_flushbar: ^1.12.30
  super_tooltip: ^2.1.0
  firebase_analytics: ^11.6.0
  facebook_app_events: ^0.24.0
  shimmer: ^3.0.0
  flutter_stripe: ^12.4.0
  
  # hydrated_bloc: ^10.1.1
dependency_overrides:
  stripe_ios:
    git:
      url: https://github.com/sebastienkothe/flutter_stripe.git
      ref: fix/bump-stripe-ios-sdk-25.9
      path: packages/stripe_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^5.0.0


flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/app-logo.png"
    min_sdk_android: 21
    remove_alpha_ios: true
  
flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
    - assets/regionalIMG/
    - assets/templates/
    - assets/countries.json
    

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Light.ttf
          weight: 300
        - asset: assets/fonts/Comfortaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700